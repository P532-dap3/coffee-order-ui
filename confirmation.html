<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Confirmation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="header">Coffee Order System <span class="status">Order Status</span></div>
<div class="confirmation">
  <p>Order Placed:</p>
  <p id="order-id"></p>
  <p id="order-summary"></p>
  <p id="order-total"></p>
</div>
<script>
  window.onload = async () => {
    const order = JSON.parse(sessionStorage.getItem('order'));
    try {
      const response = await fetch("https://coffee-order-latest-sato.onrender.com/orders", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(order)
      });

      if (!response.ok) {
        throw new Error("Failed to submit order.");
      }

      const receipt = await response.json();

      // Update UI with real receipt info
      document.getElementById('order-id').innerText = "Order id: " + receipt.id;
      document.getElementById('order-summary').innerText = receipt.description + "!";
      document.getElementById('order-total').innerText = "Total: $" + receipt.cost.toFixed(2);
    } catch (error) {
      document.getElementById('order-summary').innerText = "Failed to place order.";
      console.error("Error:", error);
    }
  };
</script>
</body>
</html>
